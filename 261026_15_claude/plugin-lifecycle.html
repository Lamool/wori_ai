<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플러그인 수명주기 · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>Claude Code 플러그인 수명주기</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-lifecycle-title plugin-lifecycle-desc">
        <title id="plugin-lifecycle-title">Claude Code 플러그인 수명주기</title>
        <desc id="plugin-lifecycle-desc">마켓플레이스 등록, 플러그인 설치, 활성과 비활성 전환, 업데이트 반영, 제거까지 플러그인 상태 전이를 보여 주는 상태 머신.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions (drawn first) -->
        <!-- 시작 → 마켓플레이스 등록됨 -->
        <line x1="48" y1="140" x2="180" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 등록됨 self-loop: marketplace update -->
        <path d="M250,96 V68 Q250,60 258,60 H302 Q310,60 310,68 V96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 등록됨 → 활성: install (focal-in) -->
        <line x1="380" y1="140" x2="520" y2="140" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 활성 → 비활성: disable -->
        <line x1="760" y1="120" x2="920" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 비활성 → 활성: enable -->
        <line x1="920" y1="160" x2="760" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 활성 → 업데이트 반영 대기: update -->
        <line x1="560" y1="184" x2="560" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 업데이트 반영 대기 → 활성: /reload-plugins (focal-in) -->
        <line x1="640" y1="280" x2="640" y2="184" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 활성 → 제거됨: uninstall -->
        <path d="M740,184 V316 Q740,324 748,324 H1004" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 비활성 → 제거됨: uninstall -->
        <line x1="1020" y1="184" x2="1020" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Transition labels -->
        <rect x="100" y="120" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="114" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADD</text>

        <rect x="256" y="40" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="50" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REFRESH</text>

        <rect x="420" y="120" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="446" y="130" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTALL</text>

        <rect x="812" y="100" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="838" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISABLE</text>

        <rect x="812" y="168" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="838" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENABLE</text>

        <rect x="508" y="226" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE</text>

        <rect x="648" y="226" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="236" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELOAD</text>

        <rect x="748" y="242" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNINSTALL</text>

        <rect x="1028" y="242" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1058" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNINSTALL</text>

        <!-- Start dot -->
        <circle cx="40" cy="140" r="6" fill="#2d3142"/>

        <!-- State: 마켓플레이스 등록됨 -->
        <rect x="180" y="96" width="200" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="188" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="208" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="280" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">마켓플레이스 등록됨</text>
        <text x="280" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">known_marketplaces.json</text>
        <text x="280" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plugins/marketplaces/&lt;name&gt;/</text>

        <!-- State: 설치됨 · 활성 (focal) -->
        <rect x="520" y="96" width="240" height="88" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="528" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="548" y="113" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">설치됨 · 활성</text>
        <text x="640" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enabledPlugins: true</text>
        <text x="640" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache/&lt;mp&gt;/&lt;plugin&gt;/&lt;ver&gt;/</text>

        <!-- State: 설치됨 · 비활성 -->
        <rect x="920" y="96" width="200" height="88" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="928" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="948" y="113" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="1020" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">설치됨 · 비활성</text>
        <text x="1020" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enabledPlugins: false</text>
        <text x="1020" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache retained</text>

        <!-- State: 업데이트 반영 대기 -->
        <rect x="520" y="280" width="200" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="528" y="288" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="548" y="297" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="620" y="324" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">업데이트 반영 대기</text>
        <text x="620" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new version cached</text>
        <text x="620" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session runs old one</text>

        <!-- End ring dot: 제거됨 -->
        <circle cx="1020" cy="324" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
        <circle cx="1020" cy="324" r="5" fill="#2d3142"/>
        <text x="1020" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">제거됨</text>

        <!-- Any-state transition (single annotation, not per-state arrows) -->
        <text x="1140" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">* → 제거됨</text>
        <text x="1140" y="400" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">marketplace remove 시 소속 플러그인 전부 제거</text>

        <!-- Callouts -->
        <line x1="60" y1="306" x2="60" y2="326" stroke="#bf4520" stroke-width="1.2"/>
        <text x="72" y="322" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">install 시 scope 선택: user · project · local</text>
        <line x1="60" y1="334" x2="60" y2="354" stroke="#bf4520" stroke-width="1.2"/>
        <text x="72" y="350" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">자동 업데이트 기본값: 공식 마켓플레이스만 on</text>

        <!-- Legend strip -->
        <line x1="60" y1="420" x2="1140" y2="420" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="60" y="436" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="92" y="446" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">핵심 상태</text>
        <rect x="200" y="436" width="24" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="232" y="446" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">비활성 상태</text>
        <circle cx="352" cy="442" r="4" fill="#2d3142"/>
        <text x="364" y="446" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">시작</text>
        <circle cx="436" cy="442" r="6" fill="none" stroke="#2d3142" stroke-width="1"/>
        <circle cx="436" cy="442" r="3.5" fill="#2d3142"/>
        <text x="448" y="446" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">종료</text>
        <line x1="520" y1="442" x2="552" y2="442" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="564" y="446" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">활성으로 들어오는 경로</text>
        <line x1="760" y1="442" x2="792" y2="442" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="804" y="446" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">명령 전이</text>
        <text x="60" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">claude plugin  marketplace add|update|remove · install · update · disable|enable · uninstall   +   /reload-plugins</text>
      </svg>
    </div>
  </div>
</body>
</html>
