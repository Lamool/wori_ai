<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계산기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="계산기">
      <header class="calc-header">
        <h1>계산기</h1>
        <div class="header-actions">
          <button id="historyToggle" class="icon-btn" aria-label="기록 보기" title="기록">🕘</button>
          <button id="themeToggle" class="icon-btn" aria-label="테마 전환" title="테마 전환">🌓</button>
        </div>
      </header>

      <div class="display" aria-live="polite">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>

      <div class="keys">
        <button class="key fn" data-action="clear">AC</button>
        <button class="key fn" data-value="(">(</button>
        <button class="key fn" data-value=")">)</button>
        <button class="key op" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key op" data-value="−">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key op" data-value="+">+</button>

        <button class="key fn" data-action="percent">%</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key fn wide" data-action="negate">±</button>
        <button class="key fn wide" data-action="backspace" aria-label="지우기">⌫</button>
      </div>
    </section>

    <aside id="history" class="history" aria-label="계산 기록">
      <div class="history-header">
        <h2>기록</h2>
        <button id="clearHistory" class="text-btn">전체 삭제</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="history-empty">계산 기록이 없습니다.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
