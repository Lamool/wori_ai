<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계산기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="visually-hidden">계산기</h1>

    <section class="calculator" aria-label="계산기">
      <div class="display" aria-live="polite">
        <p class="display-expr" id="expr"></p>
        <p class="display-result" id="result">0</p>
      </div>

      <div class="keypad">
        <button type="button" class="key key-clear" data-action="clear">AC</button>
        <button type="button" class="key key-op" data-action="op" data-value="÷" aria-label="나누기">÷</button>

        <button type="button" class="key key-num" data-action="digit" data-value="7">7</button>
        <button type="button" class="key key-num" data-action="digit" data-value="8">8</button>
        <button type="button" class="key key-num" data-action="digit" data-value="9">9</button>
        <button type="button" class="key key-op" data-action="op" data-value="×" aria-label="곱하기">×</button>

        <button type="button" class="key key-num" data-action="digit" data-value="4">4</button>
        <button type="button" class="key key-num" data-action="digit" data-value="5">5</button>
        <button type="button" class="key key-num" data-action="digit" data-value="6">6</button>
        <button type="button" class="key key-op" data-action="op" data-value="−" aria-label="빼기">−</button>

        <button type="button" class="key key-num" data-action="digit" data-value="1">1</button>
        <button type="button" class="key key-num" data-action="digit" data-value="2">2</button>
        <button type="button" class="key key-num" data-action="digit" data-value="3">3</button>
        <button type="button" class="key key-op" data-action="op" data-value="+" aria-label="더하기">+</button>

        <button type="button" class="key key-num key-zero" data-action="digit" data-value="0">0</button>
        <button type="button" class="key key-num" data-action="dot" aria-label="소수점">.</button>
        <button type="button" class="key key-equals" data-action="equals" aria-label="계산하기">=</button>
      </div>
    </section>

    <section class="history" aria-labelledby="history-title">
      <div class="history-head">
        <h2 class="history-title" id="history-title">계산 기록</h2>
        <button type="button" class="history-clear" id="history-clear" disabled>기록 지우기</button>
      </div>
      <p class="history-empty" id="history-empty">계산하면 여기에 기록이 남습니다</p>
      <ul class="history-list" id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
